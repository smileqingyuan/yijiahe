server:
  port: 10801

# 项目相关配置
moowu:
  # 名称
  name: moowu
  # 版本
  version: 1.0.1
  # 版权年份
  copyrightYear: 2024
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/wei/uploadPath，Linux配置 /home/wei/uploadPath）
  profile: /Users/weifw/uploadPath/moowu
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 开发环境
  env: dev
  # 文件域名前缀
  #  uploadBaseUrl: https://jfarm-1256225819.cos.ap-nanjing.myqcloud.com
  modelDocUrl: /Users/weifw/moowu/model_doc


# database 数据库
spring:
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 10
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  # 数据库配置
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 30000 # 连接超时（毫秒）
      idle-timeout: 600000 # 连接最大空闲时间（毫秒）
      max-lifetime: 900000 # 连接最长生命周期（毫秒）
      minimum-idle: 3 # 连接池最小空闲连接数
      maximum-pool-size: 10 # 连接池最大连接数
      pool-name: DateSourceHikariCP # 连接池名字
      connection-test-query: SELECT 1
      auto-commit: true # 自动提交

    # 配置数据库
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/moowu?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&useServerPrepStmts=true
    username: root
    password: root

## mybatis-plus
mybatis-plus:
  #  检查XML映射文件
  check-config-location: true
  configuration:
    #    驼峰命名
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      #      设置逻辑删除
      logic-delete-value: 0
      logic-not-delete-value: 1
      update-strategy: ignored

  mapper-locations: classpath*:mapper/**/*Mapper.xml

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true


# spring-doc 接口文档
springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true

# 日志配置
logging:
  level:
    com.moowu: debug
    org.springframework: debug